version: "3.9"
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: face-compare-api:latest
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    # If you want to mount local model/weights at runtime, uncomment volumes below
    # volumes:
    #   - ./models:/app/models:ro
    #   - ./weights:/app/weights:ro
    restart: unless-stopped
